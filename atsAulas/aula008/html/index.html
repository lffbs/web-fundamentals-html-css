<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../../../img/favicon/favicon.ico"
      type="image/x-icon"
    />
    <title>Intalico e negrito do jeito certo!!</title>
  </head>
  <body>
    <header><h1>Apredendo a usar intalico e negrito</h1></header>
    <main>
        <h2>Negrito</h2>
        <p>Aqui está um texo com uma <b>parte em negrito.(Não semantica)</b></p>
        <p>Aqui está um texo com uma <strong>parte em negrito.(Semantica)</strong> </p>
        <h3>Intalico</h3>
        <p>Aqui está um texto com uma <i>parte em intalico.(Não semantico)</i></p>
        <p>Aqui está um texto com uma <em>parte em intalico.(semantico)</em></p>
    </main>
  </body>
</html>
